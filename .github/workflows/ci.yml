name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 步骤 1: 检出代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 步骤 2: 设置缓存（修复版）
      - name: Cache Dependencies
        uses: actions/cache@v3
        id: cache-deps
        with:
          # 修正后的路径（使用绝对路径或环境变量）
          path: |
            node_modules
            .npm
            ${{ runner.temp }}/.yarn-cache  # 替代 ~/.cache/yarn
          # 更精确的缓存键
          key: ${{ runner.os }}-deps-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      # 步骤 3: 仅在缓存未命中时安装依赖
      - name: Install Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile --cache-folder ${{ runner.temp }}/.yarn-cache  # 指定缓存目录

      # 步骤 4: 构建项目
      - name: Build
        run: yarn build
